name: Configuration Java

on:
  push:
    branches: [ "main" ]

jobs:
  affichage:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # pour la mise à jour de l'onglet Security and quality
      contents: read # lire le code source
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Afficher version java
        run: java --version

      - name: Afficher version maven
        run: mvn --version

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean package -DskipTests

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4