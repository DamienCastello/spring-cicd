name: Mise en place CodeQL
run-name: Mise en place CodeQL et Jacoco

on:
  push:
    branches: [ "main" ]

jobs:
  affichage:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # pour la mise à jour de l'onglet Security and quality
      contents: read # lire le code source
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Afficher version java
        run: java --version

      - name: Afficher version maven
        run: mvn --version

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Sauvegarder le rapport JaCoCo
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Générer le site Maven
        run: mvn site

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v4
        with:
          name: rapport-checkstyle
          path: target/site/