name: Configuration Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        
      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Afficher version java
        run: java --version

      - name: Afficher version maven
        run: mvn --version